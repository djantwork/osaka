<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids</title>
  <style>
    :root {
      color-scheme: dark;
      --hud-color: #d8f3ff;
      --accent: #8ee3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1b2230 0, #060b15 45%, #000 100%);
      color: var(--hud-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
    }
    .hud {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 14px;
    }
    .hud span {
      color: var(--accent);
      font-weight: 600;
    }
    .instructions {
      font-size: 12px;
      opacity: 0.8;
    }
    .game-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--hud-color);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }
    .overlay h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.05em;
    }
    .overlay p { margin: 4px 0; }
    .lives {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .life-icon {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid var(--hud-color);
      transform: translateY(-2px);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>ASTEROIDS</h1>
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Level: <span id="level">1</span></div>
      <div>Lives: <span id="lives" class="lives"></span></div>
      <div class="instructions">← / → rotate · ↑ thrust · Space fire</div>
    </div>
  </header>
  <div class="game-wrapper">
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">Ready</h2>
      <p id="overlay-body">Destroy all asteroids</p>
      <p>Press Space to start</p>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
